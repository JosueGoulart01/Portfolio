<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowFace" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridFace" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0a0a0a"/>
  <rect width="800" height="500" fill="url(#gridFace)"/>
  <rect width="800" height="500" fill="url(#glowFace)"/>

  <!-- scanner frame corners -->
  <g stroke="#6366f1" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M280 150 H320 M280 150 V190"/>
    <path d="M520 150 H480 M520 150 V190"/>
    <path d="M280 350 H320 M280 350 V310"/>
    <path d="M520 350 H480 M520 350 V310"/>
  </g>

  <!-- face -->
  <g stroke="#a5b4fc" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 175 C455 175 480 215 480 260 C480 315 445 340 400 340 C355 340 320 315 320 260 C320 215 345 175 400 175 Z"/>
    <path d="M370 280 Q400 305 430 280"/>
  </g>
  <circle cx="365" cy="245" r="6" fill="#6366f1"/>
  <circle cx="435" cy="245" r="6" fill="#6366f1"/>

  <!-- face mesh landmark points -->
  <g fill="#6366f1" fill-opacity="0.8">
    <circle cx="400" cy="225" r="3"/>
    <circle cx="400" cy="260" r="3"/>
    <circle cx="345" cy="270" r="3"/>
    <circle cx="455" cy="270" r="3"/>
    <circle cx="400" cy="330" r="3"/>
  </g>
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="400" y1="225" x2="365" y2="245"/>
    <line x1="400" y1="225" x2="435" y2="245"/>
    <line x1="400" y1="260" x2="345" y2="270"/>
    <line x1="400" y1="260" x2="455" y2="270"/>
    <line x1="400" y1="260" x2="400" y2="330"/>
  </g>

  <!-- scan line -->
  <rect x="280" y="248" width="240" height="4" fill="url(#scanLine)"/>

  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="6" fill="#6366f1" fill-opacity="0.7" font-weight="bold">FACE RECOGNITION SYSTEM</text>
</svg>
